# Proxy reverso com TLS para humanos e mTLS para agentes.
#
#   https://app.example.internal/         -> painel (login normal da aplicação)
#   https://app.example.internal/agent/   -> exige certificado de cliente da CA interna
#   wss://app.example.internal/agent/ws   -> WebSocket dos agentes (mTLS)
#
# Gerar uma CA interna e um certificado de cliente (exemplo, rode fora do servidor):
#   openssl req -x509 -newkey rsa:4096 -nodes -days 3650 -subj "/CN=Example Agents CA" \
#           -keyout client-ca.key -out client-ca.crt
#   openssl req -newkey rsa:2048 -nodes -subj "/CN=agent-store-01" -keyout agent.key -out agent.csr
#   openssl x509 -req -in agent.csr -CA client-ca.crt -CAkey client-ca.key -CAcreateserial \
#           -days 825 -out agent.crt
# Guarde client-ca.key OFFLINE; o servidor só precisa de client-ca.crt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_backend {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name app.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;

    # mTLS opcional no nível do servidor; obrigatório só em /agent/
    ssl_client_certificate /etc/nginx/certs/client-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;
    # ssl_crl /etc/nginx/certs/client-ca.crl;   # revogação de agentes descomissionados

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 50m;

    location /agent/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # A aplicação identifica o agente pelo certificado, nunca por um header do cliente
        proxy_set_header X-Client-Cert-DN     $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_read_timeout 1h;   # WebSocket de longa duração
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Nunca repassar o DN de cliente na rota pública (anti-spoof)
        proxy_set_header X-Client-Cert-DN  "";
    }
}
